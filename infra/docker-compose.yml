services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trainops
      POSTGRES_PASSWORD: trainops
      POSTGRES_DB: trainops
    ports:
      - "5432:5432"
    volumes:
      - trainops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainops"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - trainops-redis:/data

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: trainops
      POSTGRES_PWD: trainops
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  api:
    build:
      context: ..
      dockerfile: infra/python.Dockerfile
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["uvicorn", "trainops_api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"

  worker:
    build:
      context: ..
      dockerfile: infra/python.Dockerfile
    env_file: ../.env
    depends_on:
      temporal:
        condition: service_started
      redis:
        condition: service_started
    command: ["python", "-m", "trainops_worker.worker"]

volumes:
  trainops-postgres:
  trainops-redis:

