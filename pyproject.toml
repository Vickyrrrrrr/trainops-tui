[project]
name = "trainops"
version = "0.1.0"
description = "BYOK human-in-the-loop TUI-first platform for model training operations"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "asyncssh>=2.14",
  "cryptography>=42",
  "fastapi>=0.111",
  "greenlet>=3.0",
  "httpx>=0.27",
  "huggingface-hub>=0.23",
  "litellm>=1.40",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "redis>=5.0",
  "rich>=13.7",
  "sqlalchemy>=2.0",
  "structlog>=24.1",
  "temporalio>=1.6",
  "textual>=0.68",
  "toml>=0.10",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]
lite = [
  "aiosqlite>=0.20",
]

[project.scripts]
trainops     = "trainops_tui.cli:main"
trainops-tui = "trainops_tui.app:main"
trainops-api = "trainops_api.main:run"
trainops-worker = "trainops_worker.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/trainops_api",
  "apps/tui/trainops_tui",
  "apps/worker/trainops_worker",
  "packages/agents/trainops_agents",
  "packages/common/trainops_common",
  "packages/connectors/trainops_connectors",
  "packages/docsgen/trainops_docsgen",
  "packages/domain/trainops_domain",
  "packages/observability/trainops_observability",
  "packages/prompts/trainops_prompts",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "apps/api",
  "apps/tui",
  "apps/worker",
  "packages/agents",
  "packages/common",
  "packages/connectors",
  "packages/docsgen",
  "packages/domain",
  "packages/observability",
  "packages/prompts",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["E501", "S101", "S104", "S105", "S113", "ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = [
  "trainops_tui",
  "trainops_agents",
  "trainops_api",
  "trainops_worker",
  "trainops_connectors",
  "trainops_common",
  "trainops_domain",
  "trainops_docsgen",
  "trainops_observability",
  "trainops_prompts",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["infra/alembic"]
